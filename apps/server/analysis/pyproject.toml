[project]
name = "orbis-analysis"
version = "1.0.0"
description = "Tempo and loudness of a Set's Retained Audio, for the Orbis audio node."
requires-python = ">=3.12,<3.14"
dependencies = [
  "beat-this==1.1.0",
  "numpy>=2",
  "torch==2.15.0",
  "torchaudio==2.11.1",
]

[project.scripts]
orbis-analyze = "orbis_analysis.analyze:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbis_analysis"]

# The CPU wheels: the node has no GPU, and the CUDA build is several GB larger.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
